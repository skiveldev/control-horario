name: Firebase bootstrap diagnostic (single branch)

# One explicitly authorized push; no manual dispatch or automatic retry.
# This branch does not match the ordinary Flutter CI branch filters.
on:
  push:
    branches:
      - 'diagnostic/firebase-bootstrap-608d971-once'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-clockin-dart
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
      - name: Prepare tools and record candidate
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export FIREBASE_EMULATORS_PATH="$RUNNER_TEMP/bootstrap-emulators"
          echo "FIREBASE_EMULATORS_PATH=$FIREBASE_EMULATORS_PATH" >> "$GITHUB_ENV"
          mkdir -p evidence "$FIREBASE_EMULATORS_PATH"
          git rev-parse HEAD > evidence/commit.txt
          sha256sum firestore.rules firebase.t3.json pubspec.lock package-lock.json test/firestore/seed_clocking_service_emulator.mjs test/features/dashboard/services/firebase_bootstrap_emulator_test.dart .github/workflows/firebase_bootstrap_diagnostic.yml > evidence/inputs.sha256
          flutter --version > evidence/flutter.txt
          node --version > evidence/node.txt
          java -version 2> evidence/java.txt
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee evidence/npm-ci.log
          npm install --prefix "$RUNNER_TEMP/bootstrap-tools" --ignore-scripts --no-audit --no-fund --fetch-retries=0 firebase-tools@15.24.0 2>&1 | tee evidence/firebase-install.log
          echo "$RUNNER_TEMP/bootstrap-tools/node_modules/.bin" >> "$GITHUB_PATH"
          flutter pub get --enforce-lockfile 2>&1 | tee evidence/pub-get.log
      - name: Verify pinned emulator and native browser
        timeout-minutes: 3
        run: |
          set -euo pipefail
          curl --fail --location --max-time 120 --output "$FIREBASE_EMULATORS_PATH/cloud-firestore-emulator-v1.21.0.jar" https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.21.0.jar
          echo "c3d3680a89d946a90a027365ea14c26c6472a162bcf37f099bbb1ebd66d25e8e  $FIREBASE_EMULATORS_PATH/cloud-firestore-emulator-v1.21.0.jar" | sha256sum --check | tee evidence/emulator-checksum.txt
          firebase --version | tee evidence/firebase-cli.txt
          test "$(firebase --version)" = '15.24.0'
          node -e 'const x=require(process.env.RUNNER_TEMP+"/bootstrap-tools/node_modules/firebase-tools/lib/emulator/downloadableEmulatorInfo.json"); if(x.firestore.version!=="1.21.0") process.exit(1)'
          CHROME_EXECUTABLE="$(command -v google-chrome)"
          echo "CHROME_EXECUTABLE=$CHROME_EXECUTABLE" >> "$GITHUB_ENV"
          "$CHROME_EXECUTABLE" --version | tee evidence/chrome.txt
          export CHROME_EXECUTABLE
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tempfile, time, urllib.parse, urllib.request
          profile = pathlib.Path(tempfile.mkdtemp(prefix='bootstrap-cdp-', dir=os.environ['RUNNER_TEMP']))
          started = time.monotonic()
          deadline = started + 15
          state = {'status': 'failed', 'stage': 'launch', 'budget_seconds': 15,
                   'port_file_state': 'not_observed'}
          browser = None
          with open('evidence/chrome-smoke.log', 'w') as log:
              try:
                  browser = subprocess.Popen([os.environ['CHROME_EXECUTABLE'], '--headless', '--no-sandbox', '--no-first-run', '--disable-background-networking', '--remote-debugging-port=0', '--user-data-dir='+str(profile), 'about:blank'], stdout=log, stderr=log)
                  port_file = profile / 'DevToolsActivePort'
                  state['stage'] = 'port_file'
                  while True:
                      if browser.poll() is not None:
                          raise RuntimeError('browser_exited_before_readiness')
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise TimeoutError('port_file_deadline_exceeded')
                      try:
                          port = int(port_file.read_text().splitlines()[0])
                          if not 1 <= port <= 65535:
                              raise ValueError('port_out_of_range')
                          state['port_file_state'] = 'valid'
                          state['port'] = port
                          break
                      except FileNotFoundError:
                          state['port_file_state'] = 'missing'
                      except (ValueError, IndexError) as error:
                          state['port_file_state'] = 'invalid'
                          state['port_file_error'] = str(error)
                      time.sleep(min(0.1, max(0, deadline - time.monotonic())))
                  state['stage'] = 'cdp_response'
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise TimeoutError('cdp_deadline_exceeded')
                  opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
                  with opener.open(f'http://127.0.0.1:{port}/json/version', timeout=min(3, remaining)) as response:
                      payload = json.load(response)
                  if time.monotonic() >= deadline:
                      raise TimeoutError('cdp_deadline_exceeded')
                  endpoint = urllib.parse.urlparse(payload['webSocketDebuggerUrl'])
                  if (not isinstance(payload.get('Browser'), str) or not payload['Browser']
                          or endpoint.scheme != 'ws' or endpoint.hostname not in ('127.0.0.1', 'localhost')
                          or endpoint.port != port):
                      raise ValueError('invalid_cdp_response')
                  if browser.poll() is not None:
                      raise RuntimeError('browser_exited_before_readiness')
                  pathlib.Path('evidence/cdp.json').write_text(json.dumps(payload))
                  state.update(status='ready', stage='complete')
              except Exception as error:
                  state['error_type'] = type(error).__name__
                  state['error'] = str(error)
                  raise
              finally:
                  state['elapsed_seconds'] = round(time.monotonic() - started, 3)
                  state['process_returncode_before_cleanup'] = None if browser is None else browser.poll()
                  # Cleanup has its own bounded grace period, outside readiness.
                  if browser is not None and browser.poll() is None:
                      browser.terminate()
                      try:
                          browser.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          browser.kill()
                          browser.wait()
                  pathlib.Path('evidence/cdp-readiness.json').write_text(json.dumps(state, indent=2))
                  print('CDP_READINESS ' + json.dumps(state), flush=True)
          PY
      - name: Analyze and compile the exact diagnostic source before execution
        timeout-minutes: 3
        run: |
          set -euo pipefail
          flutter analyze --no-pub --fatal-infos --fatal-warnings test/features/dashboard/services/firebase_bootstrap_emulator_test.dart 2>&1 | tee evidence/analyze.log
          flutter build web --debug --no-pub --no-web-resources-cdn --no-wasm-dry-run --dart-define=FIREBASE_BOOTSTRAP_DIAGNOSTIC=true --target test/features/dashboard/services/firebase_bootstrap_emulator_test.dart 2>&1 | tee evidence/compile.log
          sha256sum --check evidence/inputs.sha256
      - name: Run only the isolated bootstrap diagnostic
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # A fresh emulator process, no imported data and no preceding JS suites.
          # flutter test compiles its own browser harness; the build above is
          # a source compilation gate, not validation of that runtime harness.
          firebase emulators:exec --project demo-clockin-dart --config firebase.t3.json --only auth,firestore 'node test/firestore/seed_clocking_service_emulator.mjs && flutter test --no-pub --reporter expanded --platform chrome --dart-define=FIREBASE_BOOTSTRAP_DIAGNOSTIC=true test/features/dashboard/services/firebase_bootstrap_emulator_test.dart' 2>&1 | tee evidence/bootstrap.log
      - name: Preserve diagnostic evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            *-debug.log
          retention-days: 7
          if-no-files-found: error
