# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Configurar análisis estricto
  strong-mode:
    implicit-casts: false
    implicit-dynamic: false
  
  # Excluir archivos generados automáticamente
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - "build/**"
    - "scripts/**"  # Scripts de desarrollo pueden usar print()
    - "tool/**"     # Herramientas de desarrollo
  
  # Errores fatales (detiene la compilación)
  errors:
    # APIs deprecadas externas son errores
    deprecated_member_use: error
    # APIs deprecadas del mismo paquete (Riverpod) NO bloquean (Fase 1)
    deprecated_member_use_from_same_package: ignore
    
    # print() en código de producción es error
    avoid_print: error
    
    # Contextos asíncronos pueden causar bugs
    use_build_context_synchronously: error
    
    # Imports no usados (warning, no bloquea)
    unused_import: ignore
    
    # Variables no usadas (ignore)
    unused_local_variable: ignore
    
    # Doc comments (ignore en Fase 1)
    unintended_html_in_doc_comment: ignore

linter:
  rules:
    # ========================================================================
    # ERRORES COMUNES (Prevención de bugs)
    # ========================================================================
    - avoid_print  # NO usar print() en producción
    - avoid_returning_null_for_void  # void functions no deben retornar null
    - avoid_slow_async_io  # Evitar operaciones síncronas en async
    - cancel_subscriptions  # Cancelar StreamSubscriptions
    - close_sinks  # Cerrar Sinks de Streams
    - use_build_context_synchronously  # BuildContext en funciones async
    - valid_regexps  # RegExp válidas
    
    # ========================================================================
    # ESTILO Y CONSISTENCIA (Solo lo esencial para Fase 1)
    # ========================================================================
    - prefer_single_quotes  # Usar comillas simples 'texto'
    # - prefer_const_constructors  # (Desactivado en Fase 1)
    # - prefer_const_declarations  # (Desactivado en Fase 1)
    - prefer_final_fields  # Campos inmutables como final
    - unnecessary_const  # Eliminar const redundantes
    - unnecessary_new  # NO usar 'new' (ya no es necesario)
    # - unnecessary_this  # (Desactivado en Fase 1)
    - prefer_is_empty  # Usar .isEmpty en lugar de .length == 0
    - prefer_is_not_empty  # Usar .isNotEmpty
    
    # ========================================================================
    # RENDIMIENTO (Relaxado para Fase 1)
    # ========================================================================
    - avoid_function_literals_in_foreach_calls  # forEach puede ser lento
    - prefer_spread_collections  # Usar ... en lugar de addAll
    # - unnecessary_lambdas  # Evitar lambdas innecesarias (Desactivado)
    
    # ========================================================================
    # DOCUMENTACIÓN (Desactivado en Fase 1 - Activar en Fase 2)
    # ========================================================================
    # - package_api_docs  # Documentar APIs públicas
    # - public_member_api_docs  # Documentar miembros públicos
    
    # ========================================================================
    # SEGURIDAD TIPO (Type Safety) - Relaxado para Fase 1
    # ========================================================================
    - always_declare_return_types  # Declarar tipos de retorno
    # - avoid_dynamic_calls  # Evitar llamadas a dynamic (Desactivado Fase 1)
    # - type_annotate_public_apis  # Anotar tipos (Desactivado Fase 1)
    
    # ========================================================================
    # IMPORTS (Relaxado para Fase 1)
    # ========================================================================
    # - always_use_package_imports  # Usar package: imports (Activar en Fase 2)
    - avoid_relative_lib_imports  # NO usar imports relativos desde lib/

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
